name: Start Project

on:
    pull_request:
    push:
      branches: [main]

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  creates-valid-project:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create test project
        # tp is used as prettier will reformat files if the name is too long, 
        # causing the test to fail as the generated project won't match the expected 
        # output.
        run: |
          cat <<EOF > answers.yml
          user_name: Ackama
          user_email: ackama@example.com
          project_name: Test Project
          project_module: tp
          use_feature_toggles: true
          ts_integration: true
          use_htmx: true
          EOF
          uvx copier copy . --data-file answers.yml -f tp

      # Copier does not generate the lockfiles required by the Dockerfile.
      - name: Generate lock files in the generated project
        run: |
          cd tp
          uv lock
          npm install --package-lock-only

      # act requires the workflow's directory to be a git repository.
      - name: Initialise git in the generated project
        run: |
          cd tp
          git init --quiet
          git add --all
          git -c user.email=hello@ackama.com -c user.name=CI commit --quiet --message="Initial commit"

      # Run the generated project's own CI workflow (`.github/workflows/ci.yml`)
      # end-to-end with `act`.
      - name: Install act
        env:
          ACT_VERSION: v0.2.89
        run: |
          curl -sSfL "https://raw.githubusercontent.com/nektos/act/${ACT_VERSION}/install.sh" \
            | sudo bash -s -- -b /usr/local/bin "${ACT_VERSION}"

      - name: Run the generated project's CI workflow with act
        run: |
          cd tp
          act push -P ubuntu-latest=catthehacker/ubuntu:act-latest
